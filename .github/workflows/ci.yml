name: Prototype CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, formatting, and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Create log directory
        run: mkdir -p "$RUNNER_TEMP/verification"

      - name: Install dependencies
        run: npm ci 2>&1 | tee "$RUNNER_TEMP/verification/install.log"

      - name: Run ESLint
        run: npm run lint 2>&1 | tee "$RUNNER_TEMP/verification/lint.log"

      - name: Check formatting
        run: npm run format:check 2>&1 | tee "$RUNNER_TEMP/verification/format.log"

      - name: Run unit tests
        run: npm test 2>&1 | tee "$RUNNER_TEMP/verification/unit-tests.log"

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/verification/
          retention-days: 30
          if-no-files-found: warn
