<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#004d75" />
    <title>PriceTrackers</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Kanit:ital,wght@0,700;1,800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="top">
        <a class="brand" href="#" id="brand" aria-label="PriceTrackers home">
          <img src="./logo-mark.png" alt="" width="44" height="44" />
          <span>
            <span class="mark">PriceTrackers</span>
            <span class="title" id="title">Home</span>
          </span>
        </a>
        <div class="actions">
          <button
            class="icon-btn"
            id="theme-toggle"
            type="button"
            aria-label="Switch light or dark theme"
          >
            <i data-icon="moon"></i>
          </button>
          <button
            class="pill"
            id="basket-button"
            type="button"
            aria-label="Open basket"
          >
            <i data-icon="bag"></i><span class="hide-sm">Basket</span
            ><span id="basket-count">0</span>
          </button>
          <button class="pill" id="who" type="button">Sign in</button>
        </div>
      </header>

      <section id="view" aria-live="polite"></section>

      <nav class="nav" aria-label="Main">
        <span class="nav-glow" aria-hidden="true"></span>
        <button type="button" data-view="home">
          <i data-icon="home"></i><span>Home</span>
        </button>
        <button type="button" data-view="search">
          <i data-icon="search"></i><span>Search</span>
        </button>
        <button type="button" data-view="profile">
          <i data-icon="user"></i><span>Profile</span>
        </button>
      </nav>
    </main>

    <dialog id="auth-window" aria-labelledby="auth-title">
      <form id="auth" class="auth" method="dialog">
        <div class="auth-head">
          <div>
            <div class="auth-brand">
              <img src="./logo-mark.png" alt="" width="52" height="52" /><span
                >PriceTrackers</span
              >
            </div>
            <h2 id="auth-title">Welcome back</h2>
            <p class="notice">
              Sign in to keep a wishlist of items you're watching.
            </p>
          </div>
          <button
            class="icon-btn"
            id="close-auth"
            type="button"
            aria-label="Close"
          >
            <i data-icon="x"></i>
          </button>
        </div>
        <div class="seg" role="tablist" data-mode="login">
          <button type="button" id="tab-in" role="tab">Sign in</button>
          <button type="button" id="tab-up" role="tab">Create account</button>
        </div>
        <input id="name" placeholder="Name" autocomplete="name" hidden />
        <input
          id="email"
          type="email"
          placeholder="Email"
          autocomplete="email"
          required
        />
        <input
          id="password"
          type="password"
          minlength="8"
          placeholder="Password, 8 or more characters"
          autocomplete="current-password"
          required
        />
        <button class="solid" id="submit" type="submit">Sign in</button>
        <div class="divider">or</div>
        <a
          class="ghost google"
          id="google"
          href="http://127.0.0.1:3000/api/auth/google"
          >Continue with Google</a
        >
        <p class="notice" id="auth-notice" role="alert"></p>
      </form>
    </dialog>

    <dialog id="basket-window" class="drawer" aria-labelledby="basket-title">
      <div class="sheet">
        <div class="sheet-head">
          <div>
            <h2 id="basket-title">Basket</h2>
            <p class="notice" id="basket-sub"></p>
          </div>
          <button
            class="icon-btn"
            id="close-basket"
            type="button"
            aria-label="Close basket"
          >
            <i data-icon="x"></i>
          </button>
        </div>
        <div id="basket-list"></div>
        <div id="basket-summary"></div>
      </div>
    </dialog>

    <div class="toasts" id="toasts" aria-live="polite"></div>
    <script src="./app.js"></script>
  </body>
</html>
